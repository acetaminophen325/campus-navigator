<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCI Camp Navigator</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================================================================
       Left panel: controls + results
  ================================================================ -->
  <aside id="sidebar">
    <header id="app-header">
      <h1>UCI Camp Navigator</h1>
      <p class="subtitle">Find nearby classes in real time</p>
    </header>

    <!-- ============ Search view: all controls ============ -->
    <div id="search-view">

    <!-- ---- Mode ---- -->
    <section class="control-section">
      <div class="mode-toggle" role="group" aria-label="Tracking mode">
        <button id="mode-live" class="mode-btn" aria-pressed="false">
          <span class="live-dot" aria-hidden="true"></span> Live
        </button>
        <button id="mode-custom" class="mode-btn" aria-pressed="false">Custom</button>
      </div>
      <p id="mode-hint" class="status-text"></p>
    </section>

    <!-- ---- Location ---- -->
    <section class="control-section" id="location-section">
      <h2>Location</h2>

      <button id="btn-geolocate" class="btn btn-outline">
        <span class="icon">&#x25CE;</span> Use My Location
      </button>

      <div class="divider-or">or</div>

      <label for="building-select">Select a building</label>
      <select id="building-select">
        <option value="">— choose a building —</option>
      </select>

      <p class="status-text map-click-hint">Tip: click anywhere on the map to simulate a position.</p>
      <p id="location-status" class="status-text"></p>
    </section>

    <!-- ---- Date & Time ---- -->
    <section class="control-section">
      <h2>Date &amp; Time</h2>

      <div class="row-2col">
        <div>
          <label for="day-select">Day</label>
          <select id="day-select">
            <option value="M">Monday</option>
            <option value="Tu">Tuesday</option>
            <option value="W">Wednesday</option>
            <option value="Th">Thursday</option>
            <option value="F">Friday</option>
            <option value="Sa">Saturday</option>
            <option value="Su">Sunday</option>
          </select>
        </div>
        <div>
          <label for="time-input">Time</label>
          <input id="time-input" type="time" />
        </div>
      </div>

      <button id="btn-now" class="btn btn-ghost btn-sm">Reset to now</button>
    </section>

    <!-- ---- Options ---- -->
    <section class="control-section options-row">
      <label class="checkbox-label">
        <input id="chk-ongoing" type="checkbox" checked />
        Include ongoing classes
      </label>
    </section>

    <!-- ---- Filters ---- -->
    <section class="control-section" id="filters-section">
      <button id="btn-filters-toggle" class="filters-toggle" aria-expanded="false">
        <span class="filters-toggle-label">
          <span class="icon">&#9783;</span> Filters
        </span>
        <span id="filters-active-badge" class="filters-badge" hidden>0</span>
        <span class="filters-chevron">&#8250;</span>
      </button>

      <div id="filters-panel" class="filters-panel" hidden>

        <!-- Department -->
        <div class="filter-group">
          <label for="filter-dept">Department</label>
          <select id="filter-dept">
            <option value="">All departments</option>
          </select>
        </div>

        <!-- Course level -->
        <div class="filter-group">
          <span class="filter-group-label">Course level</span>
          <div class="chip-row">
            <label class="chip-label">
              <input class="chk-level" type="checkbox" value="lower" />
              Lower Div
            </label>
            <label class="chip-label">
              <input class="chk-level" type="checkbox" value="upper" />
              Upper Div
            </label>
            <label class="chip-label">
              <input class="chk-level" type="checkbox" value="grad" />
              Graduate
            </label>
          </div>
        </div>

        <!-- Section type -->
        <div class="filter-group">
          <span class="filter-group-label">Section type</span>
          <div class="chip-row">
            <label class="chip-label">
              <input class="chk-type" type="checkbox" value="Lec" />
              Lecture
            </label>
            <label class="chip-label">
              <input class="chk-type" type="checkbox" value="Dis" />
              Discussion
            </label>
            <label class="chip-label">
              <input class="chk-type" type="checkbox" value="Lab" />
              Lab
            </label>
            <label class="chip-label">
              <input class="chk-type" type="checkbox" value="Sem" />
              Seminar
            </label>
            <label class="chip-label">
              <input class="chk-type" type="checkbox" value="Stu" />
              Studio
            </label>
          </div>
        </div>

        <button id="btn-filters-clear" class="btn btn-ghost btn-sm">Clear filters</button>
      </div>
    </section>

    <!-- ---- Topic search ---- -->
    <section class="control-section">
      <label for="query-input">Topic search <span class="label-optional">(optional)</span></label>
      <div class="query-wrap">
        <input id="query-input" type="text"
               placeholder="e.g. machine learning, algorithms, writing…"
               autocomplete="off" spellcheck="false" />
        <button id="btn-query-clear" class="btn-query-clear" title="Clear" hidden>&#10005;</button>
      </div>
      <p class="query-hint">Ranks results by BM25 text relevance + proximity when filled in.</p>
    </section>

    <!-- ---- CTA ---- -->
    <section class="control-section">
      <button id="btn-search" class="btn btn-primary" disabled>
        Find Nearby Classes
      </button>
      <p id="search-error" class="error-text"></p>
    </section>

    </div><!-- /#search-view -->

    <!-- ============ Results view: replaces the controls ============ -->
    <div id="results-view" hidden>
      <div id="results-view-header">
        <button id="btn-back" class="btn-back">
          <span aria-hidden="true">&#8592;</span> Back to search
        </button>
        <div id="results-view-meta">
          <span id="results-count"></span>
          <p id="results-context"></p>
        </div>
      </div>
      <p id="results-note" class="results-note" hidden></p>
      <ul id="results-list"></ul>
    </div>
  </aside>

  <!-- ================================================================
       Right panel: map
  ================================================================ -->
  <main id="map-container">
    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
